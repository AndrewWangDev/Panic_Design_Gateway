name: "Feature / Optimization Request"
description: "Suggest a new edge fault injection capability, protocol handler, or telemetry enhancement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or use case does this feature address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Implementation
      description: How should the edge gateway implement this capability?
    validations:
      required: true

  - type: textarea
    id: performance
    attributes:
      label: Edge Performance Assessment
      description: How will this maintain sub-millisecond evaluation in edge memory?
    validations:
      required: false
