name: CI Gateway Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Explicit least-privilege permission declaration (OpenSSF & GitHub Security Standard)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gateway Typecheck & Security Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        run: npm test
